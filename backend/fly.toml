app = "math-misconception-api-odyspgkn"
primary_region = "iad"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8080"
  # API keys should be set as secrets, not in this file
  # See: https://fly.io/docs/reference/secrets/

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.cors_origins]]
  origin = "https://math-misconception-app-tjar7k5y.devinapps.com"
  methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  headers = ["Content-Type", "Authorization"]
  credentials = true

[mounts]
  source = "math_misconception_data"
  destination = "/data"
